[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-booking"
version = "0.2.0"
description = "Selenium/Playwright-based hotel search scraper for Booking.com"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "playwright>=1.45,<2",
    "pandas>=2.2,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
]
webapp = [
    "streamlit>=1.50,<2",
]

[project.scripts]
booking-booking = "booking_booking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["live: hits the real Booking.com site; not run in CI, run manually and sparingly"]
